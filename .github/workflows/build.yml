name: Build BARAD RUNNER Offline APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Use the exact Three.js version used by approved V3, but bundle it
      # into a classic browser script for Android WebView. Runtime stays offline.
      - name: Install Node build tools and exact Three.js
        run: |
          npm init -y
          npm install --no-save esbuild three@0.186.1
      - name: Build Three.js global bundle
        run: |
          npx esbuild node_modules/three/build/three.module.js \
            --bundle --format=iife --global-name=THREE --minify \
            --outfile=tools/three.global.js
      - name: Bundle exact V3 into one offline HTML
        run: python3 tools/make_offline.py
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Sign APK
        run: |
          keytool -genkeypair -keystore release.jks -storepass android -keypass android -alias barad -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BARAD RUNNER,O=BARAD,C=US"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/barad-runner-aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks release.jks --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/BARAD_RUNNER_OFFLINE.apk app/build/outputs/apk/release/barad-runner-aligned.apk
      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/BARAD_RUNNER_OFFLINE.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/BARAD_RUNNER_OFFLINE.apk | head -5
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BARAD_RUNNER_OFFLINE_APK
          path: app/build/outputs/apk/release/BARAD_RUNNER_OFFLINE.apk
